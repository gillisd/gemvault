name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['4.0.1']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Run unit tests
      run: bundle exec rake test
    - name: Run host specs
      run: bundle exec rake spec:host
    - name: Run RuboCop
      run: bundle exec rake rubocop

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['4.0.1']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Ensure podman is available
      run: command -v podman || (sudo apt-get update && sudo apt-get install -y podman)
    - name: Build test container image
      run: bundle exec rake spec:build
    - name: Run integration specs
      run: bundle exec rake spec:integration
